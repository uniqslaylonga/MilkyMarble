<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milky Marble — Change Password</title>
  <link rel="icon" type="image/png" href="/customer/images/logo.png">
  <link rel="stylesheet" href="css/employeelogin.css">
</head>

<body>
  <div class="topbar">
    <div class="logo-circle img"><img src="/customer/images/logo.png" alt="Milky Marble logo"></div>
    <div class="brand-name">MILKY MARBLE</div>
  </div>

  <div class="main">
    <div class="card">
      <h1>New Password</h1>
      <p class="subtitle">You signed in with a temporary password. Please choose your own to continue.</p>

      <div id="errorMsg" class="error-msg" style="display: none;"></div>

      <form id="changeForm">
        <label for="currentPassword">Temporary password</label>
        <div class="input-wrap">
          <input type="password" id="currentPassword" placeholder="Enter your temporary password" required
            autocomplete="current-password">
        </div>

        <label for="newPassword">New password</label>
        <div class="input-wrap">
          <input type="password" id="newPassword" placeholder="At least 8 characters" required minlength="8"
            autocomplete="new-password">
        </div>

        <label for="confirmPassword">Confirm new password</label>
        <div class="input-wrap">
          <input type="password" id="confirmPassword" placeholder="Re-enter your new password" required
            autocomplete="new-password">
        </div>

        <button type="submit" id="submitBtn" class="login-btn"
          style="cursor: pointer; position: relative; z-index: 9999;">Save Password &nbsp;→</button>
      </form>
    </div>
  </div>

  <div class="wave">
    <img src="/customer/images/wave.png" alt="Decorative wave">
  </div>

  <script src="js/changePassword.js"></script>
</body>

</html>
