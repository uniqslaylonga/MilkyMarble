<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milky Marble — Employee Login</title>
  <link rel="icon" type="image/png" href="/customer/images/logo.png">
  <link rel="stylesheet" href="css/employeelogin.css">
</head>

<body>

  <div class="topbar">
    <div class="logo-circle img"><img src="/customer/images/logo.png" alt="Milky Marble logo"></div>
    <div class="brand-name">MILKY MARBLE</div>
  </div>

  <div class="main">
    <div class="card">
      <h1>Welcome!</h1>
      <p class="subtitle">Employee Portal</p>

      <div id="errorMsg" class="error-msg" style="display: none;"></div>

      <form id="loginForm">
        <label for="username">Username</label>
        <div class="input-wrap">
          <span class="email-icon"><img src="/customer/images/account.png" alt="User icon"></span>
          <input type="text" id="username" name="username" placeholder="Enter your username" required
            autocomplete="username">
        </div>

        <label for="password">Password</label>
        <div class="input-wrap">
          <button type="button" class="password-toggle toggle-password" data-target="password"
            aria-label="Show password">
            <svg class="eye-open" viewBox="0 0 40 40" width="20" height="20" style="display:none">
              <path d="M8 20 C11 13 15.5 10 20 10 C24.5 10 29 13 32 20 C29 27 24.5 30 20 30 C15.5 30 11 27 8 20 Z"
                fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linejoin="round" />
              <circle cx="20" cy="20" r="5" fill="#ffffff" />
            </svg>
            <svg class="eye-closed" viewBox="0 0 40 40" width="20" height="20">
              <path d="M8 20 C11 13 15.5 10 20 10 C24.5 10 29 13 32 20 C29 27 24.5 30 20 30 C15.5 30 11 27 8 20 Z"
                fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linejoin="round" />
              <circle cx="20" cy="20" r="5" fill="#ffffff" />
              <line x1="9" y1="31" x2="31" y2="9" stroke="#F69299" stroke-width="3.4" stroke-linecap="round" />
              <line x1="9" y1="31" x2="31" y2="9" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
          <input type="password" id="password" name="password" placeholder="Enter your password" required
            autocomplete="current-password">
        </div>

        <div class="row-between">
          <a href="#" class="forgot">Forgot password?</a>
        </div>

        <button type="submit" id="submitBtn" class="login-btn"
          style="cursor: pointer; position: relative; z-index: 9999;">Log In &nbsp;→</button>
      </form>
    </div>
  </div>

  <div class="wave">
    <img src="/customer/images/wave.png" alt="Decorative wave">
  </div>

  <script src="js/employeelogin.js"></script>
</body>

</html>
