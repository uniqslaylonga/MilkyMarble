<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="only light">
  <title>Milky Marble - Sweet Updates</title>
  <link rel="icon" type="image/png" href="images/logo.png">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Sniglet:wght@400;800&family=Urbanist:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/notifications.css">
  <link rel="stylesheet" href="css/cart.css">

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <!-- NAVBAR COMPONENT -->
  <header class="navbar-wrapper" data-current-page="notifications">
    <div class="navbar-container">
      <a href="home.html#drinks" class="brand-container-nav" id="mainBrandContainer">
        <img src="images/logo.png" alt="Milky Marble Logo" class="brand-logo-img-nav">
        <span class="brand-name-nav">Milky Marble</span>
      </a>

      <nav class="nav-pill-menu desktop-nav-menu" id="mainNavPills">
        <a href="home.html#drinks" class="nav-pill-link" id="nav-drinks">
          <i class="fa-solid fa-mug-hot"></i>
          <span>Drinks</span>
        </a>
        <a href="home.html#customize" class="nav-pill-link" id="nav-customize">
          <i class="fa-solid fa-shapes"></i>
          <span>Customize</span>
        </a>
        <a href="orders.html" class="nav-pill-link" id="nav-orders">
          <i class="fa-solid fa-tags"></i>
          <span>Orders</span>
        </a>
        <a href="home.html#about" class="nav-pill-link" id="nav-about">
          <i class="fa-solid fa-circle-info"></i>
          <span>About</span>
        </a>
      </nav>

      <div class="nav-actions">
        <div class="nav-quick-actions" id="globalNavQuickActions">
          <a href="orders.html" class="nav-quick-action-btn" title="View your order history">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>Order History</span>
          </a>
        </div>

        <button type="button" class="nav-icon-btn" id="navSavedBuildsBtn" title="Your Saved Builds">
          <i class="fa-solid fa-bookmark"></i>
          <span class="nav-cart-badge" id="navSavedBuildsCount" style="display: none;">0</span>
        </button>

        <a href="cart.html" class="nav-icon-btn" title="Shopping Cart">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="nav-cart-badge" id="navCartCount" style="display: none;">0</span>
        </a>

        <div class="nav-notif-container" id="navNotifContainer"></div>
        <div class="nav-user-slot" id="navUserSlot"></div>
      </div>
    </div>
  </header>

  <main class="notifications-page-wrapper">
    <div class="notifications-header-row">
      <h1 class="notifications-main-heading">Sweet Updates</h1>
    </div>

    <section class="notifications-list-container" id="notificationsListContainer">
      <div class="notif-loading-state">
        <i class="fa-solid fa-spinner fa-spin"></i>
        <p>Loading your sweet updates...</p>
      </div>
    </section>
  </main>

  <script src="js/navbar.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
