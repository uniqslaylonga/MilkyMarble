<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - Milky Marble</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="stylesheet" href="css/login.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <div class="page">
    <div class="side-left">
      <div class="topbar">
        <div class="logo-circle img"><img src="images/logo.png" alt="Milky Marble logo"></div>
        <div class="brand-name">MILKY MARBLE</div>
      </div>

      <div class="hero-copy">
        <h1>Jelly, but make it a drink.</h1>
        <p>Log in and build your dream cup today!</p>
      </div>

      <div class="hero-art">
        <img src="images/drinks.png" alt="Milky Marble drinks">
      </div>
    </div>

    <div class="side-right">
      <div class="card">
        <h2>Log In</h2>

        <div id="server-error-msg" class="server-error"></div>

        <form id="loginForm" novalidate>
          <label for="username">Username or Email</label>
          <div class="input-wrap">
            <span class="input-icon"><img src="images/account.png" alt="username icon"></span>
            <input type="text" id="username" name="username" placeholder="Enter username or email" autocomplete="username" required>
          </div>
          <div class="field-error" id="username-error"></div>

          <label for="password">Password</label>
          <div class="input-wrap">
            <button type="button" class="password-toggle toggle-password" data-target="password" aria-label="Show password">
              <svg class="eye-open" viewBox="0 0 40 40" style="display:none">
                <path d="M8 20 C11 13 15.5 10 20 10 C24.5 10 29 13 32 20 C29 27 24.5 30 20 30 C15.5 30 11 27 8 20 Z" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linejoin="round"/>
                <circle cx="20" cy="20" r="5" fill="#ffffff"/>
              </svg>
              <svg class="eye-closed" viewBox="0 0 40 40">
                <path d="M8 20 C11 13 15.5 10 20 10 C24.5 10 29 13 32 20 C29 27 24.5 30 20 30 C15.5 30 11 27 8 20 Z" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linejoin="round"/>
                <circle cx="20" cy="20" r="5" fill="#ffffff"/>
                <line x1="9" y1="31" x2="31" y2="9" stroke="#F69299" stroke-width="3.4" stroke-linecap="round"/>
                <line x1="9" y1="31" x2="31" y2="9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </button>
            <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
          </div>
          <div class="field-error" id="password-error"></div>
          <div style="text-align:right; margin-top:-8px; margin-bottom:12px;">
            <a href="#" id="forgotPasswordLink" class="forgot" style="font-size:13px;">Forgot password?</a>
          </div>

          <div class="row-between">
            <label class="remember">
              <input type="checkbox" id="remember" name="remember">
              Remember me
            </label>
            <a href="signup.html" class="forgot">Don't have an account? Sign up</a>
          </div>

          <button type="submit" class="login-btn" id="submitBtn">Log In &nbsp;→</button>

          <div class="divider"><span>Or log in with</span></div>

          <div class="social-row">
            <div class="social-btn-wrap">
              <button type="button" class="social-btn" id="btnGoogleLogin" title="Log in with Google" aria-label="Log in with Google">
                <svg viewBox="0 0 24 24" width="20" height="20"><path fill="#fff" d="M21.35 11.1h-9.17v2.9h5.27c-.23 1.44-1.6 4.22-5.27 4.22-3.17 0-5.76-2.62-5.76-5.86s2.59-5.86 5.76-5.86c1.8 0 3.01.77 3.7 1.43l2.52-2.43C16.86 3.9 14.79 3 12.18 3 6.99 3 2.8 7.19 2.8 12.36s4.19 9.36 9.38 9.36c5.41 0 9-3.8 9-9.15 0-.62-.07-1.08-.15-1.47Z"/></svg>
              </button>
              <div id="googleButtonHidden"></div>
            </div>
          </div>
        </form>

        <a href="home.html" class="guest">Continue as Guest</a>
      </div>
    </div>
  </div>

  <div class="wave">
    <img src="images/wave.png" alt="Decorative wave">
  </div>

  <script src="js/login.js"></script>
</body>
</html>
