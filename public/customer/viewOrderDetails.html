<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="viewOrderDetails.css">
    <link rel="icon" type="image/png" href="images/logo.png">
</head>
<body>

    <button type="button" class="btn-primary" onclick="fetchAndOpenOrder(1)">
        View Order #1
    </button>

    <div class="product-modal-backdrop" id="orderDetailsModal" onclick="closeOrderDetailsModal(event)">
        <div class="product-modal-container order-summary-card" onclick="event.stopPropagation()">
            <button type="button" class="modal-close-btn" onclick="closeOrderDetailsModal()" title="Close details">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="modal-header-row">
                <div>
                    <span id="detailOrderRef" class="order-ref-text">#MM-0000</span>
                    <h2 class="summary-main-title">Order Status</h2>
                </div>
                <span id="detailStatusBadge" class="order-status-badge">Confirmed</span>
            </div>

            <div class="order-tracker-card">
                <div class="order-tracker-steps">
                    <span>Confirmed</span>
                    <span>Preparing</span>
                    <span>Ready for Pick-up</span>
                    <span>Completed</span>
                </div>
                <div class="progress-track">
                    <div id="detailProgressBar" class="progress-fill"></div>
                </div>
            </div>

            <div class="summary-section-block">
                <h3 class="summary-section-title">Pick-up Information</h3>
                <div class="recipient-input-card">
                    <div class="info-row">
                        <span>Pick-up Date:</span>
                        <strong id="detailPickupDate">-</strong>
                    </div>
                    <div class="info-row">
                        <span>Recipient:</span>
                        <strong id="detailRecipient">-</strong>
                    </div>
                    <div class="info-row">
                        <span>Payment Method:</span>
                        <strong id="detailPaymentMethod">-</strong>
                    </div>
                </div>
            </div>

            <div class="summary-section-block">
                <h3 class="summary-section-title">Items Ordered</h3>
                <div id="detailCupsList" class="summary-cups-list"></div>
            </div>

            <div class="summary-section-block summary-totals-block">
                <div class="summary-final-total-row">
                    <span class="final-total-label">Total Amount Paid</span>
                    <span class="final-total-val" id="detailFinalTotal">₱ 0.00</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/viewOrderDetails.js"></script>
</body>
</html>
